[workspace]
resolver = "2"
members = [
    "crates/droply-domain",
    "crates/droply-application",
    "crates/droply-infra",
    "apps/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
droply-domain = { path = "crates/droply-domain" }
droply-application = { path = "crates/droply-application" }
droply-infra = { path = "crates/droply-infra" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = { version = "0.7" }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
async-trait = "0.1"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
