services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: droply
      POSTGRES_PASSWORD: droply
      POSTGRES_DB: droply
    ports:
      # Host port 5434, not 5432 — this machine already runs other local
      # Postgres containers bound to 5432/5433.
      - "5434:5432"
    volumes:
      - droply-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droply"]
      interval: 5s
      timeout: 5s
      retries: 5

  droply-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://droply:droply@postgres:5432/droply
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      PORT: 8080
      RUST_LOG: info
    ports:
      # Host port 8082 — 8080/8081 are already used by other local
      # containers on this machine.
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  droply-postgres-data:
